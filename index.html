<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="container-fluid d-flex justify-content-between">
            <div>
                <h1 class="fw-bold mt-3">Task List</h1>
            </div>
            <div>
                <button class="btn btn-primary mt-3 px-3" type="button" data-bs-toggle="modal" data-bs-target="#addTaskModal">+ Add task</button>
            </div>
        </div>
    </header>
    <main>
        <div class="container border mt-5 d-flex justify-content-between py-3">
            <div class="d-flex w-100">
                <div style="width: 40%;">
                    <small class="text-secondary">Task</small>
                    <div>Go to gym</div>
                </div>
                <div style="width: 30%;">
                    <small>Priority</small>
                    <div class="text-danger">High</div>
                </div>
                <div style="width: 30%;" class="d-flex align-items-center">
                To Do
                </div>
            </div>
            <div class="d-flex align-items-center gap-5">
                <i class="bi bi-circle task1-circle"></i>
                <i class="bi bi-pencil-square"></i>
                <i class="bi bi-trash3 text-danger"></i>
            </div>
        </div>
        <div class="container border mt-5 d-flex justify-content-between py-3">
            <div class="d-flex w-100">
                <div style="width: 40%;">
                    <small class="text-secondary">Task</small>
                    <div>Read a book</div>
                </div>
                <div style="width: 30%;">
                    <small>Priority</small>
                    <div class="text-success">Low</div>
                </div>
                <div style="width: 30%;" class="d-flex align-items-center">
                Done
                </div>
            </div>
            <div class="d-flex align-items-center gap-5">
                <i class="bi bi-circle task2-circle"></i>
                <i class="bi bi-pencil-square"></i>
                <i class="bi bi-trash3 text-danger"></i>
            </div>
        </div>
        <div class="container border mt-5 d-flex justify-content-between py-3">
            <div class="d-flex w-100">
                <div style="width: 40%;">
                    <small class="text-secondary">Task</small>
                    <div>Go to market</div>
                </div>
                <div style="width: 30%;"> 
                    <small>Priority</small>
                    <div class="text-warning">Medium</div>
                </div>
                <div style="width: 30%;" class="d-flex align-items-center">
                In progess
                </div>
            </div>
            <div class="d-flex align-items-center gap-5">
                <i class="bi bi-circle task3-circle"></i>
                <i class="bi bi-pencil-square"></i>
                <i class="bi bi-trash3 text-danger"></i>
            </div>
        </div>
        <div class="modal" id="addTaskModal" tabindex="-1">
            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content">
                    <div class="modal-header">
                        <h4 class="modal-title fw-bold">Add task</h4>
                        <button class="btn-close" type="button" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <form id="taskForm">
                        <div class="modal-body">
                            <small class="fw-bold text-secondary">Task</small>
                            <input type="text" id="taskInput" class="form-control" placeholder="Type your task here...">
                        
                            <small class="fw-bold text-secondary d-flex mt-3">Priority</small>
                            <div class="d-flex gap-3 mt-3">
                                <button class="border border-danger px-2 py-2 btn btn-outline-danger fw-semibold" type="button">High</button>
                                <button class="border border-warning px-2 py-2 btn btn-outline-warning fw-semibold" type="button">Medium</button>
                                <button class="border border-success px-2 py-2 btn btn-outline-success fw-semibold" type="button">Low</button>
                            </div>
                        </div>
                        <div class="modal-footer">
                            <button class="btn btn-outline-secondary" type="submit" fw-semibold>Add</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="main.js"></script>
</body>
</html>
